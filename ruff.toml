# Deliberately close to defaults. The point is a floor that CI enforces, not a
# style argument. Same policy as the sister project (http-bait).
line-length = 100
target-version = "py312"

[lint]
select = ["E", "F", "W", "B", "UP", "C4"]
ignore = [
    "E501",  # line length is reported by the formatter, not worth failing CI over
]

[lint.per-file-ignores]
"tests/*.py" = ["F841"]
